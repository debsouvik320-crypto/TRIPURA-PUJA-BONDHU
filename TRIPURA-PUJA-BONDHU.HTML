<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Puja Bondhu — Tripura's Puja Guide</title>

  <meta
    name="description"
    content="Discover, plan and explore the best Durga Puja, Kali Puja and festivals across Tripura."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    /* =========================================================
       PUJA BONDHU — TRIPURA
       PREMIUM SINGLE FILE WEBSITE
       ========================================================= */

    :root {
      --bg: #07070a;
      --bg-soft: #101015;
      --card: rgba(255,255,255,0.055);
      --card-hover: rgba(255,255,255,0.09);

      --text: #ffffff;
      --muted: #a5a5b0;

      --gold: #f5b942;
      --gold-light: #ffd978;
      --orange: #ff7b2f;
      --red: #ff3d3d;

      --green: #39d98a;
      --blue: #55aaff;

      --border: rgba(255,255,255,0.1);

      --shadow:
        0 25px 80px rgba(0,0,0,0.45);

      --radius-lg: 30px;
      --radius-md: 20px;
      --radius-sm: 14px;

      --max-width: 1280px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(245,185,66,0.09), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(255,61,61,0.08), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(85,170,255,0.06), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.light {
      --bg: #f7f7f8;
      --bg-soft: #ffffff;
      --card: rgba(0,0,0,0.045);
      --card-hover: rgba(0,0,0,0.075);
      --text: #111116;
      --muted: #686873;
      --border: rgba(0,0,0,0.09);
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--gold);
      color: #111;
    }

    /* =========================================================
       BACKGROUND EFFECTS
       ========================================================= */

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .orb {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }

    .orb.one {
      background: var(--gold);
      top: 10%;
      left: -180px;
    }

    .orb.two {
      background: var(--red);
      right: -200px;
      top: 35%;
    }

    /* =========================================================
       NAVBAR
       ========================================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      height: 78px;

      display: flex;
      align-items: center;

      background: rgba(7,7,10,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom: 1px solid var(--border);
    }

    body.light .navbar {
      background: rgba(247,247,248,0.78);
    }

    .nav-inner {
      width: min(var(--max-width), calc(100% - 40px));
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background:
        linear-gradient(135deg, var(--gold), var(--orange));

      color: #111;
      font-size: 22px;

      box-shadow:
        0 8px 30px rgba(245,185,66,0.28);
    }

    .logo-text {
      font-size: 18px;
    }

    .logo-text span {
      display: block;
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: -2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      font-size: 14px;
      color: var(--muted);
      transition: 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      border: 1px solid var(--border);
      background: var(--card);

      color: var(--text);

      border-radius: 13px;

      display: grid;
      place-items: center;

      font-size: 17px;

      transition: 0.3s ease;
    }

    .icon-btn:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(245,185,66,0.4);
    }

    .mobile-menu {
      display: none;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      width: min(var(--max-width), calc(100% - 40px));
      margin: auto;

      min-height: 760px;

      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;

      gap: 70px;

      padding-top: 100px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 13px;

      border: 1px solid rgba(245,185,66,0.25);
      background: rgba(245,185,66,0.07);

      border-radius: 999px;

      color: var(--gold-light);

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--green);
    }

    .hero h1 {
      font-family: "Playfair Display", serif;

      font-size: clamp(52px, 7vw, 92px);

      line-height: 0.98;

      letter-spacing: -3px;

      margin-top: 25px;

      max-width: 720px;
    }

    .hero h1 span {
      background:
        linear-gradient(
          100deg,
          var(--gold-light),
          var(--orange),
          #ffdf8b
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 610px;

      margin-top: 28px;

      color: var(--muted);

      font-size: 17px;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: 34px;
    }

    .primary-btn {
      border: 0;

      padding: 15px 22px;

      border-radius: 15px;

      background:
        linear-gradient(135deg, var(--gold), var(--orange));

      color: #111;

      font-weight: 800;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      box-shadow:
        0 15px 40px rgba(245,185,66,0.18);

      transition: 0.3s ease;
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 20px 50px rgba(245,185,66,0.28);
    }

    .secondary-btn {
      border: 1px solid var(--border);

      padding: 14px 21px;

      border-radius: 15px;

      background: var(--card);

      color: var(--text);

      font-weight: 700;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      transition: 0.3s ease;
    }

    .secondary-btn:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    /* =========================================================
       HERO VISUAL
       ========================================================= */

    .hero-visual {
      position: relative;
      height: 570px;
    }

    .temple-card {
      position: absolute;
      inset: 30px 20px 20px 20px;

      border-radius: 36px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(245,185,66,0.17),
          rgba(255,61,61,0.10),
          rgba(0,0,0,0.8)
        );

      border: 1px solid rgba(255,255,255,0.13);

      box-shadow: var(--shadow);

      transform: rotate(2deg);
    }

    .temple-art {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255,198,86,0.28),
          transparent 26%
        ),
        linear-gradient(
          160deg,
          #19100b,
          #09080a 65%
        );
    }

    .temple-art::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,180,60,0.32),
          transparent 68%
        );

      filter: blur(15px);
    }

    .temple {
      position: relative;

      width: 250px;
      height: 280px;

      margin-top: 80px;
    }

    .temple-roof {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 120px solid transparent;
      border-right: 120px solid transparent;
      border-bottom: 130px solid #7e351e;
    }

    .temple-roof::after {
      content: "";

      position: absolute;

      left: -83px;
      top: 42px;

      width: 166px;
      height: 4px;

      background: var(--gold);

      box-shadow:
        0 17px 0 rgba(245,185,66,0.6),
        0 34px 0 rgba(245,185,66,0.35);
    }

    .temple-body {
      position: absolute;

      left: 25px;
      right: 25px;
      top: 125px;
      bottom: 0;

      border-radius: 9px 9px 0 0;

      background:
        linear-gradient(
          90deg,
          #51200f,
          #9e4926,
          #4e1e10
        );

      border: 2px solid rgba(245,185,66,0.45);
    }

    .temple-door {
      position: absolute;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: 62px;
      height: 115px;

      border-radius: 50px 50px 0 0;

      background:
        linear-gradient(
          90deg,
          #1a0904,
          #6d2d12,
          #1a0904
        );

      border: 2px solid rgba(245,185,66,0.45);
    }

    .temple-flag {
      position: absolute;

      left: 50%;
      top: -35px;

      width: 3px;
      height: 70px;

      background: var(--gold);
    }

    .temple-flag::after {
      content: "✦";

      position: absolute;

      top: -18px;
      left: -10px;

      color: var(--gold);
      font-size: 22px;
    }

    .floating-card {
      position: absolute;

      padding: 15px 17px;

      border-radius: 18px;

      background: rgba(16,16,21,0.82);

      backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.35);
    }

    body.light .floating-card {
      background: rgba(255,255,255,0.82);
    }

    .floating-card.top {
      top: 5px;
      right: -10px;
    }

    .floating-card.bottom {
      bottom: 5px;
      left: -10px;
    }

    .floating-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .floating-value {
      font-size: 16px;
      font-weight: 800;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 1px;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search-section {
      width: min(var(--max-width), calc(100% - 40px));
      margin: -15px auto 0;
    }

    .search-box {
      position: relative;

      display: grid;
      grid-template-columns: 1fr auto;

      gap: 12px;

      padding: 12px;

      border-radius: 23px;

      background:
        rgba(255,255,255,0.055);

      border: 1px solid var(--border);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.2);

      backdrop-filter: blur(20px);
    }

    .search-input-wrap {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 0 18px;
    }

    .search-icon {
      font-size: 21px;
      opacity: 0.7;
    }

    .search-input {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 16px;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-btn {
      border: 0;

      padding: 14px 22px;

      border-radius: 15px;

      background: var(--text);
      color: var(--bg);

      font-weight: 800;
    }

    /* =========================================================
       SECTION
       ========================================================= */

    .section {
      width: min(var(--max-width), calc(100% - 40px));
        margin: auto; }
